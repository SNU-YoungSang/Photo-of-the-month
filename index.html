<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이달의 사진</title>
<meta name="theme-color" content="#f4f2ef">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ground:#f4f2ef;
  --ink:#1a1817;
  --muted:#8b857e;
  --line:rgba(26,24,23,.14);
  --ring:5px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
         "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:var(--font);
  font-size:17px;line-height:1.7;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px}
.wrap{width:100%;max-width:940px;margin:0 auto;padding:0 24px}
.bleed{width:100vw;margin-left:calc(50% - 50vw)}

/* 스크롤 진행선 */
.prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--ink);z-index:80;
  transition:width .1s linear}

/* 표지 */
.cover{min-height:92svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:64px 24px 40px}
.rise{opacity:0;transform:translateY(18px)}
.up .rise{opacity:1;transform:none;transition:opacity .9s var(--ease),transform .9s var(--ease)}
.up .d1{transition-delay:.05s}.up .d2{transition-delay:.16s}.up .d3{transition-delay:.3s}
.up .d4{transition-delay:.42s}.up .d5{transition-delay:.54s}
.logo{width:auto;height:88px;margin-bottom:30px;opacity:.92}
/* 어두운 배경으로 바꿀 때는 아래 한 줄의 주석을 푸세요
   .logo{filter:invert(1)} */
@media (max-width:560px){.logo{height:74px;margin-bottom:24px}}
.cover__kicker{font-size:14px;font-weight:600;letter-spacing:.17em;color:var(--muted)}
.cover__month{font-size:clamp(50px,12vw,92px);font-weight:200;letter-spacing:-.05em;line-height:1.04;margin-top:18px}
.cover__month .yr{font-size:.38em;font-weight:500;letter-spacing:-.005em;color:var(--muted);
  vertical-align:1.08em;margin-right:.16em}
.cover__rule{width:52px;height:1px;background:var(--line);margin:32px 0}
.cover__note{font-size:17px;font-weight:400;color:var(--muted);max-width:24em}
.cover__note b{display:block;font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--ink);margin-top:8px}
.cover__note b.is-soon{color:#b4442c}
.cover__more{margin-top:48px;font-size:14px;font-weight:600;letter-spacing:.09em;color:var(--muted);text-decoration:none;
  border-bottom:1px solid var(--line);padding-bottom:3px}
.cover__more:hover{color:var(--ink)}

/* 부문 경계 */
.cat__head{text-align:center;padding:120px 24px 0;position:relative}
.cat__head::before{content:"";position:absolute;top:0;left:calc(50% - 50vw);width:100vw;height:1px;background:var(--line)}
.cat__name{font-size:clamp(38px,9vw,62px);font-weight:200;letter-spacing:-.05em;line-height:1.06;margin-top:56px}
.cat__meta{margin-top:20px;font-size:14px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.cat__count{display:inline-block;margin-top:16px;font-size:15px;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:999px;padding:5px 16px;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.cat__count b{font-weight:700;color:var(--ink);margin-right:1px}
.cat__count.is-full,.cat__count.is-full b{background:transparent;color:var(--ground)}
.cat__count.is-full{background:var(--ink);border-color:var(--ink)}

/* 사진 */
.feed{display:flex;flex-direction:column;gap:90px;margin-top:70px;padding-bottom:20px}
.photo{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(26px)}
.photo.in{opacity:1;transform:none;transition:opacity .8s var(--ease),transform .8s var(--ease)}
.frame{position:relative;width:100%;margin:0 auto;background:var(--ground)}
.frame::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  box-shadow:inset 0 0 0 var(--ring) var(--ink);opacity:0;
  transition:opacity .26s var(--ease)}
.photo.is-on .frame::after{opacity:1}
.frame img{width:100%;transition:transform .5s var(--ease),filter .3s var(--ease)}
@media (hover:hover){ .photo:not(.is-on) .frame:hover img{transform:scale(1.012)} }

.hit{position:absolute;inset:0;width:100%;padding:0;cursor:pointer;z-index:2}
.hit:disabled{cursor:not-allowed}
.badge{position:absolute;top:calc(var(--ring) + 12px);right:calc(var(--ring) + 12px);z-index:3;
  width:34px;height:34px;border-radius:50%;background:var(--ink);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  opacity:0;transform:scale(.7);transition:opacity .24s var(--ease),transform .24s var(--ease)}
.photo.is-on .badge{opacity:1;transform:none}
.badge svg{width:16px;height:16px;stroke:var(--ground);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.zoom{position:absolute;z-index:4;bottom:calc(var(--ring) + 12px);right:calc(var(--ring) + 12px);
  display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;letter-spacing:.01em;padding:8px 15px;border-radius:999px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#1a1817;transition:background .2s var(--ease)}
.zoom:hover{background:#fff}
.zoom svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}

.caption{text-align:center;padding:24px 24px 0;width:100%}
.caption h3{font-size:20px;font-weight:500;letter-spacing:-.028em;transition:opacity .25s var(--ease)}
.photo.is-locked .caption h3{opacity:.4}

@media (max-width:720px){
  .wrap{padding:0 20px}
  .feed{gap:70px;margin-left:-20px;margin-right:-20px}
}

/* 아래 막대 */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 84%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tray__in{width:100%;max-width:940px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px}
.tally{display:flex;gap:18px;font-size:14px;font-weight:500;letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{font-size:17px;font-weight:700;letter-spacing:0;color:var(--ink);display:inline-block;transition:transform .3s var(--ease)}
.tally b.bump{transform:translateY(-3px) scale(1.18)}
.send{background:var(--ink);color:var(--ground);padding:12px 30px;border-radius:999px;
  font-size:16px;font-weight:600;letter-spacing:.01em;transition:opacity .18s ease,transform .18s var(--ease)}
.send:not(:disabled):active{transform:scale(.97)}
.send:disabled{opacity:.28;cursor:not-allowed}
@media (max-width:560px){
  .tray__in{flex-direction:column;align-items:stretch;gap:11px;padding:13px 20px}
  .tally{justify-content:space-between;font-size:15px}
  .send{width:100%}
}

/* 크게 보기 */
.viewer{position:fixed;inset:0;z-index:60;background:#131110;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);opacity:0;transition:opacity .28s var(--ease)}
.viewer.show{opacity:1}
.viewer[hidden]{display:none}
.viewer__top{display:flex;justify-content:flex-end;padding:14px 18px}
.viewer__x{width:42px;height:42px;border-radius:50%;color:#f4f2ef;display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1}
.viewer__stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 14px;min-height:0}
.viewer__stage img{max-width:100%;max-height:100%;object-fit:contain;width:auto}
.viewer__foot{display:flex;align-items:center;justify-content:center;gap:20px;padding:22px 24px 30px;color:#f4f2ef}
.viewer__title{font-size:19px;font-weight:500;letter-spacing:-.02em}
.vpick{border:1px solid rgba(244,242,239,.4);color:#f4f2ef;padding:9px 22px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:.02em}
.vpick.is-on{background:#f4f2ef;color:#1a1817;border-color:#f4f2ef}
.vpick:disabled{opacity:.35;cursor:not-allowed}

/* 확인 창 */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(26,24,23,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;
  padding:34px 28px calc(30px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  animation:slide .34s var(--ease)}
@keyframes slide{from{transform:translateY(26px);opacity:0}}
@media (min-width:600px){.sheet{align-items:center}.panel{border-radius:20px;padding-bottom:34px}}
.panel h2{font-size:28px;font-weight:300;letter-spacing:-.04em}
.review{margin:24px 0 28px;display:flex;flex-direction:column;gap:14px}
.review__row{display:flex;gap:16px;font-size:17px;line-height:1.6}
.review__k{flex:0 0 58px;font-size:14px;font-weight:600;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.review__v.is-empty{color:var(--muted)}
.field label{display:block;font-size:13px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-bottom:10px}
.field input{width:100%;font:inherit;font-size:17px;background:#faf9f7;color:var(--ink);
  font-weight:500;border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.field input:focus{outline:1.5px solid var(--ink);outline-offset:0}
.hint{margin-top:11px;font-size:15px;font-weight:400;color:var(--muted);line-height:1.6}
.err{margin-top:16px;font-size:16px;color:#b4442c;line-height:1.6}
.err b{display:block;font-weight:600;letter-spacing:-.01em}
.err small{display:block;margin-top:6px;font-size:14px;font-weight:400;color:var(--muted)}
.acts{display:flex;gap:10px;margin-top:26px}
.acts .send{flex:1}
.ghost{border:1px solid var(--line);padding:12px 22px;border-radius:999px;font-size:16px;font-weight:500}

.notice{min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px}
.notice h2{font-size:clamp(32px,8vw,50px);font-weight:200;letter-spacing:-.045em;line-height:1.2}
.notice p{margin-top:22px;font-size:17px;font-weight:400;color:var(--muted);max-width:26em}
.notice a{border-bottom:1px solid var(--line);padding-bottom:2px;text-decoration:none}
.foot{text-align:center;padding:80px 24px 90px;font-size:14px;font-weight:600;letter-spacing:.09em;color:var(--muted)}
.foot a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.foot__club{display:inline-block;margin-top:18px;font-size:13px;font-weight:500;letter-spacing:.14em}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .rise,.photo{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="app"></div>
<script>
/* ═══ 설정 — 이 두 줄만 채우면 됩니다 ═══ */
const CONFIG = {
  ENDPOINT: "여기에_웹앱_URL_붙여넣기",
  SECRET:   "여기를_아무_문자열로_바꾸세요"
};
const CLUB = "서울대학교 사진동아리";
const MAX_PER_CATEGORY = 2;
/* 어두운 배경으로 바꾸려면 위 :root 에서
   --ground:#211f1d;  --ink:#f2efea;  --muted:#8f8880;
   --line:rgba(242,239,234,.16);  로 바꾸면 됩니다. */

const app = document.getElementById('app');
const picked = new Map();
let month, cats, index = new Map();

boot();

async function boot(){
  let data;
  try{
    const res = await fetch('manifest.json?v=' + Date.now());
    if(!res.ok) throw 0;
    data = await res.json();
  }catch(e){
    return notice('사진을 불러오지 못했습니다', 'manifest.json 파일이 사이트에 올라가 있는지 확인해 주세요.');
  }
  month = data.months.find(m => m.id === data.voting.month);
  if(!month) return notice('이번 달 응모작이 아직 없습니다', '공모가 시작되면 여기에 올라옵니다.');

  const dl = new Date(data.voting.deadline);
  if(Date.now() > dl.getTime())
    return notice('이번 달 투표가 마감되었습니다', '결과는 집행부 확인 후 발표됩니다. <a href="archive.html">지난 사진 보기</a>');
  cats = month.categories;
  cats.forEach(c => { picked.set(c.key, new Set()); c.photos.forEach(p => index.set(p.id, p)); });
  render(dl);
}

function render(dl){
  app.innerHTML = `
    <header class="cover" id="cover">
      <img class="logo rise d1" src="logo.png" alt="${esc(CLUB)}" width="440" height="334">
      <p class="cover__kicker rise d1">이달의 사진</p>
      <h1 class="cover__month rise d2"><span class="yr">${month.year}년</span>${month.month}월</h1>
      <div class="cover__rule rise d3"></div>
      <p class="cover__note rise d4">부문마다 두 장까지 고를 수 있습니다
        <b class="${soon(dl)?'is-soon':''}">${deadlineText(dl)}</b></p>
      <a class="cover__more rise d5" href="archive.html">지난 사진 보기</a>
    </header>

    <main>${cats.map(c => `
      <section class="cat">
        <div class="cat__head">
          <h2 class="cat__name">${esc(c.label)}</h2>
          <p class="cat__meta">${c.photos.length}점 가운데 두 장까지</p>
          <span class="cat__count" id="cnt-${c.key}"><b>0</b> / ${MAX_PER_CATEGORY}</span>
        </div>
        <div class="wrap"><div class="feed" id="feed-${c.key}"></div></div>
      </section>`).join('')}
    </main>

    <p class="foot"><a href="archive.html">지난 사진 보기</a><br><span class="foot__club">${esc(CLUB)}</span></p>

    <div class="tray"><div class="tray__in">
      <div class="tally" id="tally"></div>
      <button class="send" id="open" disabled>투표 제출</button>
    </div></div>

    <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
      <div class="viewer__top"><button class="viewer__x" id="vx" aria-label="닫기">&times;</button></div>
      <div class="viewer__stage"><img id="vimg" alt=""></div>
      <div class="viewer__foot">
        <span class="viewer__title" id="vtitle"></span>
        <button class="vpick" id="vpick"></button>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh">
      <div class="panel">
        <h2 id="sh">고른 사진</h2>
        <div class="review" id="review"></div>
        <div class="field">
          <label for="voter">이름</label>
          <input id="voter" type="text" autocomplete="name" maxlength="40" placeholder="이름을 적어 주세요">
          <p class="hint">경품 추첨에 씁니다. 누가 무엇에 투표했는지는 공개하지 않습니다.</p>
        </div>
        <p class="err" id="err" hidden></p>
        <div class="acts">
          <button class="ghost" id="back">더 볼래요</button>
          <button class="send" id="go">투표 제출</button>
        </div>
      </div>
    </div>`;

  cats.forEach(c => {
    const f = document.getElementById('feed-' + c.key);
    shuffle(c.photos.slice()).forEach((p, i) => f.insertAdjacentHTML('beforeend', card(p, c.key, i)));
  });
  wire();
  refresh(true);
  requestAnimationFrame(() => document.getElementById('cover').classList.add('up'));
  observe();
  onScroll();
}

function card(p, cat, i){
  return `<article class="photo" id="ph-${p.id}" data-id="${p.id}" data-cat="${cat}">
    <div class="frame" style="max-width:calc(78svh * ${(p.w / p.h).toFixed(3)})">
      <img src="${p.src}" alt="${esc(p.title)}" width="${p.w}" height="${p.h}"
           loading="${i < 2 ? 'eager' : 'lazy'}" decoding="async">
      <button class="hit" data-pick="${p.id}" aria-pressed="false" aria-label="${esc(p.title)} 고르기"></button>
      <span class="badge"><svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>
      <button class="zoom" data-view="${p.id}" aria-label="${esc(p.title)} 자세히 보기">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21M11 8v6M8 11h6"/></svg>자세히</button>
    </div>
    <div class="caption"><h3>${esc(p.title)}</h3></div>
  </article>`;
}

function wire(){
  document.addEventListener('click', e => {
    const vw = e.target.closest('[data-view]'); if(vw){ e.stopPropagation(); return openViewer(vw.dataset.view); }
    const pk = e.target.closest('[data-pick]'); if(pk) return toggle(pk.dataset.pick);
  });
  document.getElementById('vx').onclick = closeViewer;
  document.getElementById('open').onclick = openSheet;
  document.getElementById('back').onclick = () => document.getElementById('sheet').hidden = true;
  document.getElementById('go').onclick = send;
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(!document.getElementById('viewer').hidden) closeViewer();
    else document.getElementById('sheet').hidden = true;
  });
  window.addEventListener('scroll', onScroll, {passive:true});
}

function observe(){
  if(!('IntersectionObserver' in window))
    return document.querySelectorAll('.photo').forEach(el => el.classList.add('in'));
  const io = new IntersectionObserver((es, o) => es.forEach(e => {
    if(e.isIntersecting){ e.target.classList.add('in'); o.unobserve(e.target); }
  }), {rootMargin:'0px 0px -12% 0px'});
  document.querySelectorAll('.photo').forEach(el => io.observe(el));
}

function onScroll(){
  const h = document.documentElement.scrollHeight - window.innerHeight;
  document.getElementById('prog').style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
}

function toggle(id){
  const el = document.getElementById('ph-' + id), set = picked.get(el.dataset.cat);
  if(set.has(id)) set.delete(id);
  else if(set.size < MAX_PER_CATEGORY) set.add(id);
  else return;
  refresh();
}

function refresh(quiet){
  let total = 0;
  cats.forEach(c => {
    const set = picked.get(c.key), full = set.size >= MAX_PER_CATEGORY;
    total += set.size;
    const cnt = document.getElementById('cnt-' + c.key);
    cnt.innerHTML = `<b>${set.size}</b> / ${MAX_PER_CATEGORY}`;
    cnt.classList.toggle('is-full', full);
    c.photos.forEach(p => {
      const el = document.getElementById('ph-' + p.id), on = set.has(p.id), b = el.querySelector('.hit');
      el.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on);
      b.disabled = !on && full;
      el.classList.toggle('is-locked', b.disabled);
    });
  });
  document.getElementById('tally').innerHTML =
    cats.map(c => `<span>${esc(c.label)} <b>${picked.get(c.key).size}</b>/${MAX_PER_CATEGORY}</span>`).join('');
  if(!quiet) document.querySelectorAll('.tally b').forEach(b => {
    b.classList.add('bump'); setTimeout(() => b.classList.remove('bump'), 300);
  });
  document.getElementById('open').disabled = total === 0;
  const v = document.getElementById('viewer');
  if(!v.hidden) syncViewer(v.dataset.id);
}

function openViewer(id){
  const p = index.get(id), v = document.getElementById('viewer');
  v.dataset.id = id;
  const im = document.getElementById('vimg'); im.src = p.src; im.alt = p.title;
  document.getElementById('vtitle').textContent = p.title;
  syncViewer(id);
  v.hidden = false;
  requestAnimationFrame(() => v.classList.add('show'));
  document.body.style.overflow = 'hidden';
  document.getElementById('vx').focus();
}
function syncViewer(id){
  const el = document.getElementById('ph-' + id), set = picked.get(el.dataset.cat), on = set.has(id);
  const b = document.getElementById('vpick');
  b.textContent = on ? '선택됨' : '고르기';
  b.classList.toggle('is-on', on);
  b.disabled = !on && set.size >= MAX_PER_CATEGORY;
  b.onclick = () => toggle(id);
}
function closeViewer(){
  const v = document.getElementById('viewer');
  v.classList.remove('show'); v.hidden = true; document.body.style.overflow = '';
  const back = document.querySelector(`[data-view="${v.dataset.id}"]`); if(back) back.focus();
}

function openSheet(){
  document.getElementById('review').innerHTML = cats.map(c => {
    const t = [...picked.get(c.key)].map(id => index.get(id).title);
    return `<div class="review__row"><span class="review__k">${esc(c.label)}</span>
      <span class="review__v ${t.length?'':'is-empty'}">${t.length ? t.map(esc).join(', ') : '고르지 않음'}</span></div>`;
  }).join('');
  document.getElementById('err').hidden = true;
  document.getElementById('sheet').hidden = false;
  document.getElementById('voter').focus();
}

/* 전송 — 실패 원인을 구분해서 알려 준다 */
async function post(payload){
  if(!/^https:\/\/script\.google\.com\/macros\/.+\/exec$/.test(CONFIG.ENDPOINT))
    return {ok:false, code:'BAD_URL'};
  const body = JSON.stringify(payload);
  const opt = {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body};
  try{
    const r = await fetch(CONFIG.ENDPOINT, opt);
    const text = await r.text();
    let j; try{ j = JSON.parse(text); }catch(_){ return {ok:false, code:'NOT_JSON'}; }
    return j.ok ? {ok:true} : {ok:false, code:j.error || 'SERVER'};
  }catch(_){ /* 응답을 읽을 수 없는 경우 아래로 */ }
  try{
    await fetch(CONFIG.ENDPOINT, Object.assign({mode:'no-cors'}, opt));
    return {ok:true, blind:true};
  }catch(_){ return {ok:false, code:'NETWORK'}; }
}

const MSG = {
  BAD_URL:  ['웹 앱 주소가 올바르지 않습니다.', 'index.html 의 ENDPOINT 가 https://script.google.com/macros/… /exec 형태인지 확인해 주세요.'],
  unauthorized: ['암호가 맞지 않습니다.', 'index.html 과 apps-script.gs 의 SECRET 을 같게 맞춘 뒤, Apps Script 에서 배포 → 배포 관리 → 새 버전으로 다시 배포해 주세요.'],
  NOT_JSON: ['웹 앱이 예상과 다른 응답을 보냈습니다.', '배포 설정에서 “액세스 권한이 있는 사용자”가 “모든 사용자”인지 확인해 주세요.'],
  duplicate: ['이미 투표한 이름입니다.', '같은 이름으로는 한 번만 투표할 수 있어요. 동명이인이라면 이름 뒤에 학번이나 기수를 붙여 주세요.'],
  NETWORK:  ['네트워크 문제로 보내지 못했습니다.', '잠시 뒤 다시 눌러 주세요.'],
  SERVER:   ['서버가 요청을 거절했습니다.', '잠시 뒤 다시 눌러 주세요.']
};

async function send(){
  const b = document.getElementById('go'), er = document.getElementById('err');
  const name = document.getElementById('voter').value.trim();
  if(!name){ er.innerHTML = '<b>이름을 적어 주세요.</b>'; er.hidden = false; return document.getElementById('voter').focus(); }

  const picks = [];
  cats.forEach(c => picked.get(c.key).forEach(id =>
    picks.push({ category: c.label, id, title: index.get(id).title })));

  b.disabled = true; b.textContent = '보내는 중'; er.hidden = true;
  const out = await post({ secret: CONFIG.SECRET, name, month: month.id, picks });

  if(out.ok){
    document.body.style.overflow = '';
    return notice('투표를 제출했습니다',
      '결과는 집행부 확인 후 발표됩니다. <a href="archive.html">지난 사진 보기</a>');
  }
  const m = MSG[out.code] || MSG.SERVER;
  er.innerHTML = `<b>${esc(m[0])}</b><small>${esc(m[1])}</small><small>오류 코드 ${esc(out.code)}</small>`;
  er.hidden = false; b.disabled = false; b.textContent = '투표 제출';
}

function notice(t, html){ app.innerHTML = `<div class="notice"><h2>${esc(t)}</h2><p>${html}</p></div>`; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function soon(d){ return d.getTime() - Date.now() < 864e5; }
function deadlineText(d){
  const t = new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'numeric',minute:'2-digit'}).format(d);
  if(soon(d)) return `오늘 ${t} 마감`;
  const day = new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',weekday:'long'}).format(d);
  return `${day} ${t} 마감`;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
