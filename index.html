<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이달의 사진</title>
<meta name="description" content="이달의 사진 투표">
<meta name="theme-color" content="#34312e">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ─────────────────────────────────────────────
   색: 갤러리 벽의 따뜻한 중간 회색.
   사진의 노출과 색이 배경 때문에 왜곡되지 않게 하는 값.
   ───────────────────────────────────────────── */
:root{
  --wall:#34312e;
  --wall-up:#3d3936;
  --mat:#454039;
  --ink:#f2ede6;
  --ink-dim:#a8a099;
  --line:rgba(242,237,230,.16);
  --alert:#e0725a;
  --pad:20px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
         "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  background:var(--wall);
  color:var(--ink);
  font-family:var(--font);
  font-size:17px;
  line-height:1.62;
  font-weight:400;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(112px + env(safe-area-inset-bottom));
}

img{display:block;max-width:100%;height:auto}

button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}

.wrap{width:100%;max-width:740px;margin:0 auto;padding:0 var(--pad)}

/* ── 머리말 ───────────────────────────────── */
.masthead{padding:38px 0 30px}
.masthead__row{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.masthead h1{font-size:19px;font-weight:500;letter-spacing:.02em;color:var(--ink-dim)}
.masthead__link{font-size:16px;color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.masthead__link:hover{color:var(--ink)}
.period{font-size:42px;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.lede{margin-top:14px;font-size:17px;color:var(--ink-dim);max-width:34em}
.deadline{margin-top:4px;font-size:17px;color:var(--ink-dim)}
.deadline.is-soon{color:var(--alert)}

/* ── 부문 ─────────────────────────────────── */
.cat{margin-top:14px}
.cat__bar{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--wall) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.cat__bar .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:13px;padding-bottom:13px}
.cat__name{font-size:21px;font-weight:600;letter-spacing:-.01em}
.cat__count{font-size:16px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.cat__count.is-full{color:var(--ink)}

/* ── 사진 ─────────────────────────────────── */
.photo{padding:34px 0 6px}
.photo__view{display:block;width:100%;padding:0}
.mat{
  display:block;
  background:var(--mat);
  padding:9px;
  border:1px solid var(--line);
  transition:background .22s ease,padding .22s ease;
}
.mat img{width:100%}
.photo.is-on .mat{background:var(--ink);border-color:var(--ink);padding:15px}

.photo__meta{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-top:16px}
.photo__title{font-size:21px;font-weight:500;letter-spacing:-.015em;line-height:1.4;padding-top:2px}

.pick{
  flex:0 0 auto;
  border:1px solid var(--line);
  padding:9px 20px;
  font-size:16px;
  font-weight:500;
  white-space:nowrap;
  transition:background .15s ease,color .15s ease,border-color .15s ease,opacity .15s ease;
}
.pick:hover:not(:disabled){border-color:var(--ink)}
.photo.is-on .pick{background:var(--ink);color:#2b2825;border-color:var(--ink)}
.pick:disabled{opacity:.32;cursor:not-allowed}

/* ── 아래 고정 막대 ───────────────────────── */
.tray{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--wall-up) 94%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tray .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:15px;padding-bottom:15px}
.tally{display:flex;gap:20px;font-size:16px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.tally b{font-weight:500;color:var(--ink)}
.submit{
  background:var(--ink);color:#2b2825;
  padding:13px 26px;font-size:17px;font-weight:600;
  transition:opacity .15s ease;
}
.submit:disabled{opacity:.3;cursor:not-allowed}
@media (max-width:560px){
  .tray .wrap{flex-direction:column;align-items:stretch;gap:12px}
  .tally{justify-content:space-between}
  .submit{width:100%}
}

/* ── 크게 보기 ────────────────────────────── */
.viewer{
  position:fixed;inset:0;z-index:60;
  background:#262320;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.viewer[hidden]{display:none}
.viewer__top{display:flex;justify-content:flex-end;padding:12px 16px}
.viewer__close{font-size:16px;padding:8px 14px;border:1px solid var(--line)}
.viewer__stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 12px;min-height:0}
.viewer__stage img{max-width:100%;max-height:100%;object-fit:contain;width:auto}
.viewer__foot{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 20px 24px}
.viewer__title{font-size:20px;font-weight:500}

/* ── 확인 창 ──────────────────────────────── */
.sheet{
  position:fixed;inset:0;z-index:70;
  background:rgba(24,22,20,.72);
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet[hidden]{display:none}
.sheet__panel{
  width:100%;max-width:520px;
  background:var(--wall-up);
  border:1px solid var(--line);
  padding:30px 26px calc(30px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;
}
@media (min-width:600px){
  .sheet{align-items:center}
  .sheet__panel{padding-bottom:30px}
}
.sheet h2{font-size:26px;font-weight:600;letter-spacing:-.02em}
.review{margin:22px 0 26px;display:flex;flex-direction:column;gap:16px}
.review__cat{display:flex;gap:14px;font-size:17px;line-height:1.55}
.review__label{flex:0 0 62px;color:var(--ink-dim)}
.review__items{color:var(--ink)}
.review__items.is-empty{color:var(--ink-dim)}

.field label{display:block;font-size:16px;color:var(--ink-dim);margin-bottom:8px}
.field input{
  width:100%;font:inherit;font-size:17px;
  background:var(--wall);color:var(--ink);
  border:1px solid var(--line);padding:13px 14px;
}
.field input:focus{outline:2px solid var(--ink);outline-offset:1px}
.hint{margin-top:10px;font-size:15px;color:var(--ink-dim);line-height:1.55}
.error{margin-top:14px;font-size:16px;color:var(--alert)}
.sheet__actions{display:flex;gap:12px;margin-top:24px}
.sheet__actions .submit{flex:1}
.ghost{border:1px solid var(--line);padding:13px 22px;font-size:17px}

/* ── 안내 화면 ────────────────────────────── */
.notice{padding:96px 0 60px;text-align:left}
.notice h2{font-size:33px;font-weight:600;letter-spacing:-.025em;line-height:1.3}
.notice p{margin-top:14px;font-size:18px;color:var(--ink-dim);max-width:32em}
.notice a{color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* ══════════════════════════════════════════════════════
   설정 — 이 두 줄만 채우면 됩니다
   ══════════════════════════════════════════════════════ */
const CONFIG = {
  // Apps Script 를 웹 앱으로 배포하고 받은 주소
  ENDPOINT: "https://script.google.com/macros/s/AKfycbwOc6QPe_YuLJZE6H0LArmLpoTjtvB7rBnWc8Of1EkNcnp7wG7UFRD65PEyBLFMHjCc/exec",
  // apps-script.gs 의 SECRET 과 똑같이
  SECRET:   "dudtkd54rl"
};

const MAX_PER_CATEGORY = 2;

/* ────────────────────────────────────────── */

const app = document.getElementById('app');
const picked = new Map();   // 부문키 → Set(사진id)
let month, cats, photoIndex = new Map();

boot();

async function boot(){
  let data;
  try{
    const res = await fetch('manifest.json?v=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    data = await res.json();
  }catch(err){
    return notice('사진을 불러오지 못했습니다',
      'manifest.json 파일이 사이트에 올라가 있는지 확인해 주세요.');
  }

  month = data.months.find(m => m.id === data.voting.month);
  if(!month) return notice('이번 달 응모작이 아직 없습니다', '공모가 시작되면 여기에 올라옵니다.');

  const deadline = new Date(data.voting.deadline);
  if(Date.now() > deadline.getTime()){
    return notice('이번 달 투표가 마감되었습니다',
      '결과는 집행부 확인 후 발표됩니다. <a href="archive.html">지난 사진 보기</a>');
  }
  if(localStorage.getItem(voteKey())){
    return notice('이미 투표했습니다',
      '한 사람당 한 번만 투표할 수 있어요. <a href="archive.html">지난 사진 보기</a>');
  }

  cats = month.categories;
  cats.forEach(c => {
    picked.set(c.key, new Set());
    c.photos.forEach(p => photoIndex.set(p.id, p));
  });

  render(deadline);
}

/* ── 그리기 ──────────────────────────────── */

function render(deadline){
  app.innerHTML = `
    <header class="masthead"><div class="wrap">
      <div class="masthead__row">
        <h1>이달의 사진</h1>
        <a class="masthead__link" href="archive.html">지난 사진 보기</a>
      </div>
      <p class="period">${month.year}년 ${month.month}월</p>
      <p class="lede">부문마다 두 장까지 고를 수 있습니다. 사진을 누르면 크게 볼 수 있어요.</p>
      <p class="deadline ${soon(deadline)?'is-soon':''}">${deadlineText(deadline)}</p>
    </div></header>

    <main>${cats.map(renderCat).join('')}</main>

    <div class="tray"><div class="wrap">
      <div class="tally" id="tally"></div>
      <button class="submit" id="open-sheet" disabled>투표 제출</button>
    </div></div>

    <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
      <div class="viewer__top"><button class="viewer__close" id="viewer-close">닫기</button></div>
      <div class="viewer__stage"><img id="viewer-img" alt=""></div>
      <div class="viewer__foot">
        <span class="viewer__title" id="viewer-title"></span>
        <button class="pick" id="viewer-pick"></button>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-h">
      <div class="sheet__panel">
        <h2 id="sheet-h">고른 사진</h2>
        <div class="review" id="review"></div>
        <div class="field">
          <label for="voter">이름</label>
          <input id="voter" type="text" autocomplete="name" maxlength="40" placeholder="이름을 적어 주세요">
          <p class="hint">경품 추첨에 씁니다. 누가 무엇에 투표했는지는 공개하지 않습니다.</p>
        </div>
        <p class="error" id="error" hidden></p>
        <div class="sheet__actions">
          <button class="ghost" id="sheet-back">더 볼래요</button>
          <button class="submit" id="send">투표 제출</button>
        </div>
      </div>
    </div>`;

  cats.forEach(c => {
    const list = document.getElementById('list-' + c.key);
    shuffle(c.photos.slice()).forEach((p, i) => list.insertAdjacentHTML('beforeend', renderPhoto(p, c.key, i)));
  });

  wire();
  refresh();
}

function renderCat(c){
  return `<section class="cat">
    <div class="cat__bar"><div class="wrap">
      <h2 class="cat__name">${esc(c.label)}</h2>
      <span class="cat__count" id="count-${c.key}">0 / ${MAX_PER_CATEGORY}</span>
    </div></div>
    <div class="wrap" id="list-${c.key}"></div>
  </section>`;
}

function renderPhoto(p, catKey, i){
  return `<article class="photo" id="ph-${p.id}" data-id="${p.id}" data-cat="${catKey}">
    <button class="photo__view" data-view="${p.id}" aria-label="${esc(p.title)} 크게 보기">
      <span class="mat"><img src="${p.src}" alt="${esc(p.title)}" width="${p.w}" height="${p.h}"
        loading="${i < 2 ? 'eager' : 'lazy'}" decoding="async"></span>
    </button>
    <div class="photo__meta">
      <h3 class="photo__title">${esc(p.title)}</h3>
      <button class="pick" data-pick="${p.id}" aria-pressed="false">고르기</button>
    </div>
  </article>`;
}

/* ── 동작 ────────────────────────────────── */

function wire(){
  document.addEventListener('click', e => {
    const pickBtn = e.target.closest('[data-pick]');
    if(pickBtn) return toggle(pickBtn.dataset.pick);
    const viewBtn = e.target.closest('[data-view]');
    if(viewBtn) return openViewer(viewBtn.dataset.view);
  });

  document.getElementById('viewer-close').onclick = closeViewer;
  document.getElementById('open-sheet').onclick = openSheet;
  document.getElementById('sheet-back').onclick = () => hide('sheet');
  document.getElementById('send').onclick = send;

  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(!document.getElementById('viewer').hidden) closeViewer();
    else if(!document.getElementById('sheet').hidden) hide('sheet');
  });
}

function toggle(id){
  const el = document.getElementById('ph-' + id);
  const set = picked.get(el.dataset.cat);
  if(set.has(id)) set.delete(id);
  else if(set.size < MAX_PER_CATEGORY) set.add(id);
  refresh();
}

function refresh(){
  let total = 0;

  cats.forEach(c => {
    const set = picked.get(c.key);
    total += set.size;
    const full = set.size >= MAX_PER_CATEGORY;

    const counter = document.getElementById('count-' + c.key);
    counter.textContent = `${set.size} / ${MAX_PER_CATEGORY}`;
    counter.classList.toggle('is-full', full);

    c.photos.forEach(p => {
      const el = document.getElementById('ph-' + p.id);
      const on = set.has(p.id);
      const btn = el.querySelector('[data-pick]');
      el.classList.toggle('is-on', on);
      btn.textContent = on ? '선택됨' : '고르기';
      btn.setAttribute('aria-pressed', on);
      btn.disabled = !on && full;
    });
  });

  document.getElementById('tally').innerHTML =
    cats.map(c => `<span>${esc(c.label)} <b>${picked.get(c.key).size}</b>/${MAX_PER_CATEGORY}</span>`).join('');
  document.getElementById('open-sheet').disabled = total === 0;

  const v = document.getElementById('viewer');
  if(!v.hidden) syncViewerPick(v.dataset.id);
}

/* ── 크게 보기 ───────────────────────────── */

function openViewer(id){
  const p = photoIndex.get(id);
  const v = document.getElementById('viewer');
  v.dataset.id = id;
  document.getElementById('viewer-img').src = p.src;
  document.getElementById('viewer-img').alt = p.title;
  document.getElementById('viewer-title').textContent = p.title;
  syncViewerPick(id);
  v.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('viewer-close').focus();
}

function syncViewerPick(id){
  const el = document.getElementById('ph-' + id);
  const set = picked.get(el.dataset.cat);
  const on = set.has(id);
  const btn = document.getElementById('viewer-pick');
  btn.textContent = on ? '선택됨' : '고르기';
  btn.disabled = !on && set.size >= MAX_PER_CATEGORY;
  btn.classList.toggle('is-on-solo', on);
  btn.style.background = on ? 'var(--ink)' : '';
  btn.style.color = on ? '#2b2825' : '';
  btn.onclick = () => toggle(id);
}

function closeViewer(){
  const v = document.getElementById('viewer');
  v.hidden = true;
  document.body.style.overflow = '';
  const back = document.querySelector(`[data-view="${v.dataset.id}"]`);
  if(back) back.focus();
}

/* ── 제출 ────────────────────────────────── */

function openSheet(){
  document.getElementById('review').innerHTML = cats.map(c => {
    const titles = [...picked.get(c.key)].map(id => photoIndex.get(id).title);
    return `<div class="review__cat">
      <span class="review__label">${esc(c.label)}</span>
      <span class="review__items ${titles.length ? '' : 'is-empty'}">${
        titles.length ? titles.map(esc).join(', ') : '고르지 않음'}</span>
    </div>`;
  }).join('');
  document.getElementById('error').hidden = true;
  document.getElementById('sheet').hidden = false;
  document.getElementById('voter').focus();
}

async function send(){
  const btn = document.getElementById('send');
  const errEl = document.getElementById('error');
  const name = document.getElementById('voter').value.trim();

  if(!name){
    errEl.textContent = '이름을 적어 주세요.';
    errEl.hidden = false;
    return document.getElementById('voter').focus();
  }

  const picks = [];
  cats.forEach(c => picked.get(c.key).forEach(id => {
    picks.push({ category: c.label, id, title: photoIndex.get(id).title });
  }));

  btn.disabled = true;
  btn.textContent = '보내는 중';
  errEl.hidden = true;

  try{
    const res = await fetch(CONFIG.ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ secret: CONFIG.SECRET, name, month: month.id, picks })
    });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || '알 수 없는 오류');

    localStorage.setItem(voteKey(), '1');
    document.body.style.overflow = '';
    notice('투표를 제출했습니다',
      '결과는 집행부 확인 후 발표됩니다. <a href="archive.html">지난 사진 보기</a>');
  }catch(err){
    errEl.textContent = '제출하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.';
    errEl.hidden = false;
    btn.disabled = false;
    btn.textContent = '투표 제출';
  }
}

/* ── 도구 ────────────────────────────────── */

function notice(title, html){
  app.innerHTML = `<div class="notice"><div class="wrap">
    <h2>${esc(title)}</h2><p>${html}</p></div></div>`;
}

function hide(id){ document.getElementById(id).hidden = true; }

function voteKey(){ return 'mps-voted-' + month.id; }

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function soon(d){ return d.getTime() - Date.now() < 24 * 3600 * 1000; }

function deadlineText(d){
  const opts = { timeZone:'Asia/Seoul', hour:'numeric', minute:'2-digit' };
  const time = new Intl.DateTimeFormat('ko-KR', opts).format(d);
  if(soon(d)) return `오늘 ${time} 마감`;
  const day = new Intl.DateTimeFormat('ko-KR',
    { timeZone:'Asia/Seoul', month:'long', day:'numeric', weekday:'long' }).format(d);
  return `${day} ${time} 마감`;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
</script>
</body>
</html>
