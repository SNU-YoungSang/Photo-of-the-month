<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이달의 사진</title>
<meta name="theme-color" content="#f4f2ef">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ground:#f4f2ef;
  --ink:#1a1817;
  --muted:#8b857e;
  --line:rgba(26,24,23,.14);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,
         "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--ground);color:var(--ink);font-family:var(--font);
  font-size:17px;line-height:1.7;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px}
.wrap{width:100%;max-width:940px;margin:0 auto;padding:0 24px}

/* 표지 */
.cover{min-height:88svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px 40px}
.cover__kicker{font-size:17px;color:var(--muted);font-weight:400}
.cover__month{font-size:clamp(46px,11vw,84px);font-weight:200;letter-spacing:-.045em;line-height:1.08;margin-top:10px}
.cover__rule{width:52px;height:1px;background:var(--line);margin:32px 0}
.cover__note{font-size:17px;color:var(--muted);max-width:24em}
.cover__note b{display:block;font-weight:400;color:var(--ink);margin-top:6px}
.cover__note b.is-soon{color:#b4442c}
.cover__more{margin-top:44px;font-size:16px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.cover__more:hover{color:var(--ink)}

/* 부문 구분 */
.cat{padding:0 0 40px}
.cat__head{text-align:center;padding:76px 0 8px}
.cat__name{font-size:21px;font-weight:500;letter-spacing:.01em}
.cat__rule{width:40px;height:1px;background:var(--line);margin:18px auto 0}

/* 사진 */
.feed{display:flex;flex-direction:column;gap:80px;margin-top:56px}
.photo{display:flex;flex-direction:column;align-items:center}
.frame{position:relative;overflow:hidden;background:var(--ground);width:100%;margin:0 auto}
.frame img{width:100%;transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.photo.is-on .frame img{transform:scale(.94)}
.frame__hit{position:absolute;inset:0;width:100%;padding:0;cursor:zoom-in}

.mark{
  position:absolute;top:16px;right:16px;z-index:3;
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.9);
  transition:background .18s ease,opacity .18s ease,transform .18s ease;
}
.mark svg{width:17px;height:17px;stroke:#1a1817;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:.55;transition:opacity .18s ease,stroke .18s ease}
.photo.is-on .mark{background:var(--ink);border-color:var(--ink)}
.photo.is-on .mark svg{stroke:#fff;opacity:1}
.mark:disabled{opacity:.32;cursor:not-allowed}
.mark:hover:not(:disabled) svg{opacity:1}

.caption{text-align:center;padding:22px 24px 0;width:100%}
.caption h3{font-size:19px;font-weight:400;letter-spacing:-.01em}

@media (max-width:720px){
  .wrap{padding:0 20px}
  .feed{gap:64px;margin-left:-20px;margin-right:-20px}
  .mark{top:12px;right:12px}
}

/* 아래 막대 */
.tray{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 84%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.tray__in{width:100%;max-width:940px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:18px}
.tally{display:flex;gap:18px;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{font-weight:500;color:var(--ink)}
.send{background:var(--ink);color:var(--ground);padding:12px 30px;border-radius:999px;
  font-size:17px;font-weight:500;transition:opacity .18s ease}
.send:disabled{opacity:.28;cursor:not-allowed}
@media (max-width:560px){
  .tray__in{flex-direction:column;align-items:stretch;gap:11px;padding:13px 20px}
  .tally{justify-content:space-between;font-size:15px}
  .send{width:100%}
}

/* 크게 보기 */
.viewer{position:fixed;inset:0;z-index:60;background:#131110;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.viewer[hidden]{display:none}
.viewer__top{display:flex;justify-content:flex-end;padding:14px 18px}
.viewer__x{width:40px;height:40px;border-radius:50%;color:#f4f2ef;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1}
.viewer__stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 14px;min-height:0}
.viewer__stage img{max-width:100%;max-height:100%;object-fit:contain;width:auto}
.viewer__foot{display:flex;align-items:center;justify-content:center;gap:20px;padding:22px 24px 30px;color:#f4f2ef}
.viewer__title{font-size:19px;font-weight:400}
.vpick{border:1px solid rgba(244,242,239,.4);color:#f4f2ef;padding:9px 22px;border-radius:999px;font-size:16px}
.vpick.is-on{background:#f4f2ef;color:#1a1817;border-color:#f4f2ef}
.vpick:disabled{opacity:.35;cursor:not-allowed}

/* 확인 창 */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(26,24,23,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;
  padding:34px 28px calc(30px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto}
@media (min-width:600px){.sheet{align-items:center}.panel{border-radius:20px;padding-bottom:34px}}
.panel h2{font-size:25px;font-weight:400;letter-spacing:-.025em}
.review{margin:24px 0 28px;display:flex;flex-direction:column;gap:14px}
.review__row{display:flex;gap:16px;font-size:17px;line-height:1.6}
.review__k{flex:0 0 58px;color:var(--muted)}
.review__v.is-empty{color:var(--muted)}
.field label{display:block;font-size:16px;color:var(--muted);margin-bottom:9px}
.field input{width:100%;font:inherit;font-size:17px;background:#faf9f7;color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:14px 15px}
.field input:focus{outline:1.5px solid var(--ink);outline-offset:0}
.hint{margin-top:11px;font-size:15px;color:var(--muted);line-height:1.6}
.err{margin-top:14px;font-size:16px;color:#b4442c}
.acts{display:flex;gap:10px;margin-top:26px}
.acts .send{flex:1}
.ghost{border:1px solid var(--line);padding:12px 22px;border-radius:999px;font-size:17px}

/* 안내 */
.notice{min-height:80svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px}
.notice h2{font-size:clamp(30px,7vw,44px);font-weight:200;letter-spacing:-.035em;line-height:1.25}
.notice p{margin-top:20px;font-size:18px;color:var(--muted);max-width:26em}
.notice a{border-bottom:1px solid var(--line);padding-bottom:2px;text-decoration:none}

.foot{text-align:center;padding:70px 24px 90px;font-size:16px;color:var(--muted)}
.foot a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.foot__club{display:inline-block;margin-top:16px;font-size:15px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══ 설정 — 이 두 줄만 채우면 됩니다 ═══ */
const CONFIG = {
  ENDPOINT: "여기에_웹앱_URL_붙여넣기",
  SECRET:   "여기를_아무_문자열로_바꾸세요"
};
const CLUB = "서울대학교 사진동아리";
const MAX_PER_CATEGORY = 2;
/* 어두운 배경으로 바꾸려면 위 :root 에서
   --ground:#211f1d;  --ink:#f2efea;  --muted:#8f8880;
   --line:rgba(242,239,234,.16);  로 바꾸면 됩니다. */

const app = document.getElementById('app');
const picked = new Map();
let month, cats, index = new Map();

boot();

async function boot(){
  let data;
  try{
    const res = await fetch('manifest.json?v=' + Date.now());
    if(!res.ok) throw 0;
    data = await res.json();
  }catch(e){
    return notice('사진을 불러오지 못했습니다', 'manifest.json 파일이 사이트에 올라가 있는지 확인해 주세요.');
  }

  month = data.months.find(m => m.id === data.voting.month);
  if(!month) return notice('이번 달 응모작이 아직 없습니다', '공모가 시작되면 여기에 올라옵니다.');

  const dl = new Date(data.voting.deadline);
  if(Date.now() > dl.getTime())
    return notice('이번 달 투표가 마감되었습니다', '결과는 집행부 확인 후 발표됩니다. <a href="archive.html">지난 사진 보기</a>');
  if(localStorage.getItem(key()))
    return notice('이미 투표했습니다', '한 사람당 한 번만 투표할 수 있어요. <a href="archive.html">지난 사진 보기</a>');

  cats = month.categories;
  cats.forEach(c => { picked.set(c.key, new Set()); c.photos.forEach(p => index.set(p.id, p)); });
  render(dl);
}

function render(dl){
  app.innerHTML = `
    <header class="cover">
      <p class="cover__kicker">이달의 사진</p>
      <h1 class="cover__month">${month.year}년 ${month.month}월</h1>
      <div class="cover__rule"></div>
      <p class="cover__note">부문마다 두 장까지 고를 수 있습니다
        <b class="${soon(dl)?'is-soon':''}">${deadlineText(dl)}</b></p>
      <a class="cover__more" href="archive.html">지난 사진 보기</a>
    </header>

    <main>${cats.map(c => `
      <section class="cat">
        <div class="cat__head"><h2 class="cat__name">${esc(c.label)}</h2><div class="cat__rule"></div></div>
        <div class="wrap"><div class="feed" id="feed-${c.key}"></div></div>
      </section>`).join('')}
    </main>

    <p class="foot"><a href="archive.html">지난 사진 보기</a><br><span class="foot__club">${esc(CLUB)}</span></p>

    <div class="tray"><div class="tray__in">
      <div class="tally" id="tally"></div>
      <button class="send" id="open" disabled>투표 제출</button>
    </div></div>

    <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
      <div class="viewer__top"><button class="viewer__x" id="vx" aria-label="닫기">&times;</button></div>
      <div class="viewer__stage"><img id="vimg" alt=""></div>
      <div class="viewer__foot">
        <span class="viewer__title" id="vtitle"></span>
        <button class="vpick" id="vpick"></button>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh">
      <div class="panel">
        <h2 id="sh">고른 사진</h2>
        <div class="review" id="review"></div>
        <div class="field">
          <label for="voter">이름</label>
          <input id="voter" type="text" autocomplete="name" maxlength="40" placeholder="이름을 적어 주세요">
          <p class="hint">경품 추첨에 씁니다. 누가 무엇에 투표했는지는 공개하지 않습니다.</p>
        </div>
        <p class="err" id="err" hidden></p>
        <div class="acts">
          <button class="ghost" id="back">더 볼래요</button>
          <button class="send" id="go">투표 제출</button>
        </div>
      </div>
    </div>`;

  cats.forEach(c => {
    const f = document.getElementById('feed-' + c.key);
    shuffle(c.photos.slice()).forEach((p, i) => f.insertAdjacentHTML('beforeend', card(p, c.key, i)));
  });
  wire();
  refresh();
}

function card(p, cat, i){
  return `<article class="photo" id="ph-${p.id}" data-id="${p.id}" data-cat="${cat}">
    <div class="frame" style="max-width:calc(78svh * ${(p.w / p.h).toFixed(3)})">
      <img src="${p.src}" alt="${esc(p.title)}" width="${p.w}" height="${p.h}"
           loading="${i < 2 ? 'eager' : 'lazy'}" decoding="async">
      <button class="frame__hit" data-view="${p.id}" aria-label="${esc(p.title)} 크게 보기"></button>
      <button class="mark" data-pick="${p.id}" aria-pressed="false" aria-label="${esc(p.title)} 고르기">
        <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
      </button>
    </div>
    <div class="caption"><h3>${esc(p.title)}</h3></div>
  </article>`;
}

function wire(){
  document.addEventListener('click', e => {
    const pk = e.target.closest('[data-pick]'); if(pk) return toggle(pk.dataset.pick);
    const vw = e.target.closest('[data-view]'); if(vw) return openViewer(vw.dataset.view);
  });
  document.getElementById('vx').onclick = closeViewer;
  document.getElementById('open').onclick = openSheet;
  document.getElementById('back').onclick = () => document.getElementById('sheet').hidden = true;
  document.getElementById('go').onclick = send;
  document.addEventListener('keydown', e => {
    if(e.key !== 'Escape') return;
    if(!document.getElementById('viewer').hidden) closeViewer();
    else document.getElementById('sheet').hidden = true;
  });
}

function toggle(id){
  const el = document.getElementById('ph-' + id), set = picked.get(el.dataset.cat);
  set.has(id) ? set.delete(id) : (set.size < MAX_PER_CATEGORY && set.add(id));
  refresh();
}

function refresh(){
  let total = 0;
  cats.forEach(c => {
    const set = picked.get(c.key), full = set.size >= MAX_PER_CATEGORY;
    total += set.size;
    c.photos.forEach(p => {
      const el = document.getElementById('ph-' + p.id), on = set.has(p.id), b = el.querySelector('.mark');
      el.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on);
      b.disabled = !on && full;
    });
  });
  document.getElementById('tally').innerHTML =
    cats.map(c => `<span>${esc(c.label)} <b>${picked.get(c.key).size}</b>/${MAX_PER_CATEGORY}</span>`).join('');
  document.getElementById('open').disabled = total === 0;
  const v = document.getElementById('viewer');
  if(!v.hidden) syncViewer(v.dataset.id);
}

function openViewer(id){
  const p = index.get(id), v = document.getElementById('viewer');
  v.dataset.id = id;
  const im = document.getElementById('vimg'); im.src = p.src; im.alt = p.title;
  document.getElementById('vtitle').textContent = p.title;
  syncViewer(id);
  v.hidden = false; document.body.style.overflow = 'hidden';
  document.getElementById('vx').focus();
}

function syncViewer(id){
  const el = document.getElementById('ph-' + id), set = picked.get(el.dataset.cat), on = set.has(id);
  const b = document.getElementById('vpick');
  b.textContent = on ? '선택됨' : '고르기';
  b.classList.toggle('is-on', on);
  b.disabled = !on && set.size >= MAX_PER_CATEGORY;
  b.onclick = () => toggle(id);
}

function closeViewer(){
  const v = document.getElementById('viewer');
  v.hidden = true; document.body.style.overflow = '';
  const back = document.querySelector(`[data-view="${v.dataset.id}"]`); if(back) back.focus();
}

function openSheet(){
  document.getElementById('review').innerHTML = cats.map(c => {
    const t = [...picked.get(c.key)].map(id => index.get(id).title);
    return `<div class="review__row"><span class="review__k">${esc(c.label)}</span>
      <span class="review__v ${t.length?'':'is-empty'}">${t.length ? t.map(esc).join(', ') : '고르지 않음'}</span></div>`;
  }).join('');
  document.getElementById('err').hidden = true;
  document.getElementById('sheet').hidden = false;
  document.getElementById('voter').focus();
}

async function send(){
  const b = document.getElementById('go'), er = document.getElementById('err');
  const name = document.getElementById('voter').value.trim();
  if(!name){ er.textContent = '이름을 적어 주세요.'; er.hidden = false; return document.getElementById('voter').focus(); }

  const picks = [];
  cats.forEach(c => picked.get(c.key).forEach(id =>
    picks.push({ category: c.label, id, title: index.get(id).title })));

  b.disabled = true; b.textContent = '보내는 중'; er.hidden = true;
  try{
    const res = await fetch(CONFIG.ENDPOINT, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ secret: CONFIG.SECRET, name, month: month.id, picks })
    });
    const out = await res.json();
    if(!out.ok) throw 0;
    localStorage.setItem(key(), '1');
    document.body.style.overflow = '';
    notice('투표를 제출했습니다', '결과는 집행부 확인 후 발표됩니다. <a href="archive.html">지난 사진 보기</a>');
  }catch(e){
    er.textContent = '제출하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.';
    er.hidden = false; b.disabled = false; b.textContent = '투표 제출';
  }
}

function notice(t, html){ app.innerHTML = `<div class="notice"><h2>${esc(t)}</h2><p>${html}</p></div>`; }
function key(){ return 'mps-voted-' + month.id; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function soon(d){ return d.getTime() - Date.now() < 864e5; }
function deadlineText(d){
  const t = new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'numeric',minute:'2-digit'}).format(d);
  if(soon(d)) return `오늘 ${t} 마감`;
  const day = new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',weekday:'long'}).format(d);
  return `${day} ${t} 마감`;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
